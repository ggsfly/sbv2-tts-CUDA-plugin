[plugin]
enabled = false
config_version = "1.0.0"

[general]
timeout = 60
max_text_length = 200
use_base64_audio = false
split_sentences = true
split_delay = 0.3
send_error_messages = true
translate_to_japanese = true
# 翻译用 LLM 任务名（task name），留空用 Host 首个可用任务。
# 可选值：replyer / planner / utils / memory / mid_memory / learner / expression_use / emoji / vlm / voice / embedding
# 这不是模型标识符！具体模型在 model_config.toml 的 model_task_config.<task>.model_list 配置
translate_model = ""

[components]
tool_enabled = true
command_enabled = true

[sbv2]
api_url = "http://127.0.0.1:3000/synthesize"
default_ident = "Ling v2"
idents = ["Ling v2", "Fusetsu_v1.5"]