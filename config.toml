[plugin]
enabled = false
config_version = "1.0.0"

[general]
timeout = 60
max_text_length = 200
use_base64_audio = true
# 音频投递方式。true=base64 走 ctx.send.custom("voice")（MaiBot 官方识别的语音类型，推荐）。
# false=文件路径走 "voiceurl" 自定义类型——MaiBot 发送层不识别该类型，会掉进
# DictComponent 兜底导致适配器无法渲染成语音（snowluma 适配器实测失败，NapCat 未经测试）。
# 是否剥离 replyer 正文中的 [语音消息] 占位回声（本插件发语音后，replyer 偶尔会
# 把历史里的语音占位模仿进回复正文，产生一条无意义的引用消息）。
strip_voice_placeholder = true
split_sentences = true
split_delay = 0.3
send_error_messages = true
translate_to_japanese = true
# 翻译用 LLM。支持两种填法：
#   1) 任务名：replyer / planner / utils / memory / mid_memory / learner /
#      expression_use / emoji / vlm / voice / embedding
#   2) 模型名：model_config.toml 中 [[models]] 的 name（如 gemini-3.7-flash-low），
#      需 Host 转发 model_override 才生效，未支持时按 replyer 任务执行
# 留空 = replyer 任务（不会取到 embedding 任务，避免 404 Not Found）
translate_model = ""

[components]
tool_enabled = true
command_enabled = true

[sbv2]
api_url = "http://127.0.0.1:3000/synthesize"
default_ident = "Ling v2"
idents = ["Ling v2", "Fusetsu_v1.5"]